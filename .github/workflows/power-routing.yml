name: Train-only power-diagram IVF routing research
on:
  pull_request:
    paths:
      - 'benchmarks/power_routing.py'
      - 'benchmarks/power_routing_study.py'
      - 'tests/test_power_routing.py'
      - '.github/workflows/power-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "faiss-cpu==1.16.0"
      - name: Prove FAISS/weighted-Voronoi invariants
        run: python -m pytest -q tests/test_power_routing.py
      - name: Paired offline price calibration benchmark
        run: python -m benchmarks.power_routing_study --dataset all-offline --output /tmp/power-offline.json
      - uses: actions/upload-artifact@v4
        with:
          name: power-ivf-offline
          path: /tmp/power-offline.json
          retention-days: 30

  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install "faiss-cpu==1.16.0"
      - name: Paired real LSA document-vector calibration
        run: python -m benchmarks.power_routing_study --dataset news_lsa --output /tmp/power-documents.json
      - uses: actions/upload-artifact@v4
        with:
          name: power-ivf-documents
          path: /tmp/power-documents.json
          retention-days: 30
