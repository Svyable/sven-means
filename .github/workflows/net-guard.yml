name: Independent net-replacement revival ablation
on:
  pull_request:
    paths:
      - 'svenmeans/**'
      - 'tests/test_net_guard.py'
      - 'benchmarks/net_guard_study.py'
      - '.github/workflows/net-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU deps
        run: python -m pip install -e ".[dev]"
      - name: Verify exact net cost, split disjointness and legacy parity
        run: python -m pytest -q tests/test_net_guard.py
      - name: Paired 8-arm synthetic and real-data study
        run: python -m benchmarks.net_guard_study --dataset all-offline --output /tmp/net-offline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net-replacement-offline
          path: /tmp/net-offline.json
          retention-days: 30

  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU deps
        run: python -m pip install -e ".[dev]"
      - name: Paired real document vectors
        run: python -m benchmarks.net_guard_study --dataset news_lsa --output /tmp/net-documents.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: net-replacement-documents
          path: /tmp/net-documents.json
          retention-days: 30
