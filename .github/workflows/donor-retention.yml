name: Donor-retention paired research study
on:
  pull_request:
    paths:
      - 'svenmeans/**'
      - 'benchmarks/donor_retention_study.py'
      - '.github/workflows/donor-retention.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Paired self comparison without external downloads
        run: python benchmarks/donor_retention_study.py --dataset all-offline --output /tmp/retention-offline.json
      - uses: actions/upload-artifact@v4
        with:
          name: donor-retention-offline
          path: /tmp/retention-offline.json
          retention-days: 30
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Real latent-semantic document vectors
        run: python benchmarks/donor_retention_study.py --dataset news_lsa --output /tmp/retention-news.json
      - uses: actions/upload-artifact@v4
        with:
          name: donor-retention-documents
          path: /tmp/retention-news.json
          retention-days: 30
