[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sven-means"
version = "0.2.0a1"
description = "Experimental refactor of s-means with bounded-memory seeding and robust assignment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Svyable contributors"}]
keywords = ["clustering", "k-means", "pytorch", "triton", "vector-quantization"]
dependencies = ["numpy>=1.24", "torch>=2.1", "scikit-learn>=1.7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
triton = ["triton>=3.0"]
dev = ["pytest>=7.4"]

[project.urls]
Repository = "https://github.com/Svyable/sven-means"
Upstream = "https://github.com/suayptalha/s-means"

[tool.setuptools.packages.find]
include = ["svenmeans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
